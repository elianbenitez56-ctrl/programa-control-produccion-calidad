<!DOCTYPE html>

<body class="bg-background text-on-background min-h-screen flex items-center justify-center font-body-md text-body-md m-0 p-0 overflow-hidden">
<div class="flex w-full min-h-screen">
<!-- Left Side: Branding & Imagery -->
<div class="hidden lg:flex lg:w-1/2 bg-primary-container relative flex-col justify-between p-xl overflow-hidden">
<!-- Subtle Image Overlay -->
<div class="absolute inset-0 z-0 opacity-20 mix-blend-overlay pointer-events-none" data-alt="A highly detailed, atmospheric illustration of a modern industrial paper mill interior. The scene features massive, precision-engineered cylindrical rollers and continuous sheets of crisp white paper flowing through the machinery. The lighting is dramatic and cinematic, with strong contrasts emphasizing the metallic textures and complex structural framework. The aesthetic is clean, technological, and efficient, reflecting a high-end corporate industrial facility. The overall mood is powerful and meticulously organized, utilizing a color palette dominated by deep blues, steel grays, and bright white highlights." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBIW9HkzrOjkulWOD7EWdO2xHLS2crYX2zbFxiPidKE7PJQVEqTfbraV91kM0DwFH0JxoFHzB0LWzGsDvXp-sb7JuJ-FaZ_lCYNJdJ-pMKVeqzK31GJBVxY-7CiHwk-yJXuqlmBWCZJBoWza8Uon7mEOQZcLa0ZLGSfy7uJBl6JQ-tyGScXp4ri8wbuOxlViRIOaOzDP0vCE6DQK_6z69Kmr-FPiluRnTPojsSBNZYwWC1TE1tajj9t')">
</div>
<div class="absolute inset-0 z-0 bg-gradient-to-t from-primary-container via-transparent to-primary-container opacity-80 pointer-events-none"></div>
<!-- Content Container -->
<div class="relative z-10">
<div class="flex items-center gap-sm mb-lg">
<span class="material-symbols-outlined text-display-lg text-on-primary">factory</span>
<h1 class="font-display-lg text-display-lg text-on-primary">INAPEL</h1>
</div>
<h2 class="font-headline-md text-headline-md text-on-primary-container max-w-md mt-md">
                    Sistema de Control de Producción y Calidad
                </h2>
</div>
<div class="relative z-10 flex items-center gap-sm text-on-primary-container">
<span class="material-symbols-outlined font-label-md text-label-md">verified</span>
<p class="font-label-md text-label-md uppercase tracking-wider">Industrial Efficiency &amp; Precision</p>
</div>
</div>
<!-- Right Side: Login Form -->
<div class="w-full lg:w-1/2 flex items-center justify-center p-md bg-surface">
<div class="w-full max-w-md space-y-lg bg-surface-container-lowest p-xl rounded-xl border border-outline-variant shadow-sm">
<div class="text-center lg:text-left mb-xl">
<!-- Mobile Logo (Hidden on Desktop) -->
<div class="lg:hidden flex justify-center items-center gap-sm mb-md text-primary">
<span class="material-symbols-outlined text-headline-lg">factory</span>
<h1 class="font-headline-lg text-headline-lg font-black">INAPEL</h1>
</div>
<h2 class="font-headline-lg text-headline-lg text-on-surface">Iniciar Sesión</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-xs">Acceda al panel de control de producción.</p>
</div>
<form action="#" class="space-y-md" method="POST">
<!-- User Input -->
<div class="space-y-xs">
<label class="block font-label-md text-label-md text-on-surface" for="username">Usuario / ID de Operador</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">person</span>
</div>
<input class="block w-full pl-10 pr-3 py-2 border border-outline-variant rounded bg-surface-container-lowest text-on-surface font-body-md text-body-md focus:outline-none focus:ring-2 focus:ring-secondary focus:border-secondary transition-colors" id="username" name="username" placeholder="Ingrese su usuario" required="" type="text"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-xs mt-md">
<label class="block font-label-md text-label-md text-on-surface" for="password">Contraseña</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">lock</span>
</div>
<input class="block w-full pl-10 pr-3 py-2 border border-outline-variant rounded bg-surface-container-lowest text-on-surface font-body-md text-body-md focus:outline-none focus:ring-2 focus:ring-secondary focus:border-secondary transition-colors" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<div class="flex items-center justify-between mt-sm">
<div class="flex items-center">
<input class="h-4 w-4 text-secondary focus:ring-secondary border-outline-variant rounded bg-surface-container-lowest" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block font-body-sm text-body-sm text-on-surface-variant" for="remember-me">
                                Recordar sesión
                            </label>
</div>
<div class="text-sm">
<a class="font-label-md text-label-md text-secondary hover:text-primary transition-colors" href="#">¿Olvidó su contraseña?</a>
</div>
</div>
<!-- Submit Button -->
<button class="w-full flex justify-center py-3 px-4 border border-transparent rounded bg-primary-container font-label-md text-label-md text-on-primary hover:bg-primary focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-container transition-colors min-h-[44px] items-center uppercase mt-lg shadow-sm" type="submit">
                        Ingresar al Sistema
                        <span class="material-symbols-outlined ml-2 text-[18px]">login</span>
</button>
</form>
<!-- System Status Indicator (Mock) -->
<div class="mt-xl pt-md border-t border-outline-variant flex items-center justify-center gap-2">
<div class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
<span class="font-body-sm text-body-sm text-on-surface-variant">Sistema Operativo</span>
</div>
</div>
</div>
</div>
</body></html>
