[project]
name = "sigpc-backend"
version = "0.1.0"
description = "SIGPC - Sistema Integral de Gestion de Produccion y Calidad (Backend)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.30,<0.31",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "sqlalchemy[asyncio]>=2.0.30,<2.1",
    "aiosqlite>=0.20,<1",
    "asyncpg>=0.29,<0.30",
    "alembic>=1.13,<1.14",
    "PyJWT>=2.9,<3",
    "argon2-cffi>=23.1,<24",
    "structlog>=24,<25",
    "python-multipart>=0.0.9",
    # Reportes (Módulo 12)
    "reportlab>=4.2,<5",
    "openpyxl>=3.1,<4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=5,<6",
    "httpx>=0.27,<0.28",
    "factory-boy>=3.3,<4",
    "ruff>=0.5,<0.6",
    "mypy>=1.11,<1.12",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-q --disable-warnings"
markers = ["integration: pruebas que requieren PostgreSQL (TEST_DATABASE_URL)"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests", "manage.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N"]
ignore = ["N999", "B008"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
exclude = ["migrations/"]
